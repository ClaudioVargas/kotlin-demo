# ============================================================
# Catálogo de versiones (Gradle Version Catalog)
# Todas las versiones de dependencias/plugins viven aquí.
# ============================================================

[versions]
agp = "8.7.3"            # Android Gradle Plugin
kotlin = "2.0.21"        # Lenguaje Kotlin
coreKtx = "1.15.0"       # AndroidX Core KTX
appcompat = "1.7.0"      # ActionBar / compatibilidad
material = "1.12.0"      # Material Design 3
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
activity = "1.9.3"       # activity-ktx (viewModels delegate)
lifecycle = "2.8.7"      # ViewModel + LiveData
coroutines = "1.9.0"     # Kotlin Coroutines
retrofit = "2.11.0"      # Cliente HTTP
okhttp = "4.12.0"        # Motor HTTP de Retrofit
gson = "2.11.0"          # JSON serializer

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }