# ============================================================
# Configuración global de Gradle para este proyecto
# ============================================================

# Memoria para la JVM de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mantiene el daemon de Gradle en segundo plano (builds más rápidos)
org.gradle.daemon=true

# Obligatorio: habilita AndroidX
android.useAndroidX=true

# El R.class solo contiene recursos del módulo actual (builds más rápidos)
android.nonTransitiveRClass=true

# Estilo de código oficial de Kotlin
kotlin.code.style=official